<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073b2a">
  <meta name="description" content="Laporan bulanan LTT per kecamatan dan jenis, siap dicetak.">
  <title>Laporan Bulanan · SIMON-LTT INHIL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="laporan" class="app-body">
  <div class="boot-screen" id="boot-screen">
    <div class="boot-card">
      <div class="boot-spinner" aria-hidden="true"></div>
      <h2>Menyiapkan laporan</h2>
      <p>Menyusun rekap bulanan dari data aktif…</p>
    </div>
  </div>

  <main id="page-root" class="page" hidden>
    <div class="filter-bar no-print">
      <div class="form-field">
        <label for="laporan-bulan">Bulan</label>
        <select id="laporan-bulan"></select>
      </div>
      <div class="form-field">
        <label for="laporan-tahun">Tahun</label>
        <select id="laporan-tahun"></select>
      </div>
      <div class="form-field" id="laporan-kec-wrap">
        <label for="laporan-kecamatan">Kecamatan</label>
        <select id="laporan-kecamatan"></select>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="laporan-refresh">Tampilkan</button>
      </div>
    </div>

    <div class="section-head no-print">
      <div>
        <div class="section-title" id="laporan-heading">Laporan Bulanan</div>
        <p class="section-sub" id="laporan-sub">Rekap per kecamatan dan jenis LTT.</p>
      </div>
      <div class="section-actions">
        <button type="button" class="btn btn-outline btn-sm" id="laporan-excel">Ekspor Excel</button>
        <button type="button" class="btn btn-outline btn-sm" id="laporan-print">Cetak / PDF</button>
      </div>
    </div>

    <div id="laporan-body">
      <div class="card"><div class="card-body"><span class="spinner spinner-dark"></span> Memuat laporan…</div></div>
    </div>
  </main>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/page-common.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/laporan.js"></script>
</body>
</html>
