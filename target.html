<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073b2a">
  <meta name="description" content="Target resmi per kecamatan dan bulan serta capaian realisasinya.">
  <title>Target &amp; Capaian · SIMON-LTT INHIL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="target" class="app-body">
  <div class="boot-screen" id="boot-screen">
    <div class="boot-card">
      <div class="boot-spinner" aria-hidden="true"></div>
      <h2>Menyiapkan target &amp; capaian</h2>
      <p>Memuat target kecamatan dan realisasi LTT…</p>
    </div>
  </div>

  <main id="page-root" class="page" hidden>
    <div class="filter-bar">
      <div class="form-field">
        <label>Mode periode</label>
        <div class="segmented" id="target-mode">
          <button type="button" data-mode="bulanan" class="is-active">Bulanan</button>
          <button type="button" data-mode="tahunan">Tahunan</button>
        </div>
      </div>
      <div class="form-field" id="target-bulan-wrap">
        <label for="target-bulan">Bulan</label>
        <select id="target-bulan"></select>
      </div>
      <div class="form-field">
        <label for="target-tahun">Tahun</label>
        <select id="target-tahun"></select>
      </div>
      <div class="form-field" id="target-kec-wrap">
        <label for="target-kecamatan">Kecamatan</label>
        <select id="target-kecamatan"></select>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="target-refresh">Tampilkan</button>
        <button type="button" class="btn btn-outline" id="target-export">Ekspor CSV</button>
      </div>
    </div>

    <div id="target-body">
      <div class="card"><div class="card-body"><span class="spinner spinner-dark"></span> Memuat capaian…</div></div>
    </div>

    <div id="target-editor"></div>
  </main>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/page-common.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/target.js"></script>
</body>
</html>
